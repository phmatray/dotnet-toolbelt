# Known non-building subprojects (excluded):
#   src/monads/Monads.sln           - Monads.Tests targets xunit.v3 but is missing
#                                      <OutputType>Exe</OutputType>, which xunit.v3 requires.
#   src/linqplus/LinqNotNull.sln    - LinqNotNull.UnitTests targets net6.0; Microsoft.NET.Test.Sdk
#                                      18.4.0 no longer supports net6.0 (needs net8.0+ or
#                                      SuppressTfmSupportBuildErrors).
#   src/record-equality/RecordEquality.sln - RecordEquality.Tests targets xunit.v3 but is
#                                      missing <OutputType>Exe</OutputType>, same issue as Monads.
#   src/ccross-helper/CCrossHelper.sln - legacy .NET Framework/PCL/Windows Phone 8.1/UWP
#                                      projects (TargetFrameworkVersion v3.5/v4.5, Portable,
#                                      WindowsPhone, WindowsXaml); requires Windows + legacy
#                                      targeting packs, unsupported on the cross-platform SDK.
#   src/simple-helpers/SimpleHelpers.sln - legacy .NET Framework projects (v4.5.2 / v4.6.1)
#                                      using old-style csproj; reference assemblies for those
#                                      TFMs are unavailable on the cross-platform SDK.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Test projects target older TFMs (net8.0/net9.0) than the SDK installed below;
  # roll forward so they run against the installed net10.0 runtime.
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  build:
    name: build (${{ matrix.solution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - src/cqrs/CqrsHelpers.sln
          - src/depsinc/Depsinc.sln
          - src/throwif/CCrossThrowIf.sln
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ matrix.solution }} -c Release --no-build
